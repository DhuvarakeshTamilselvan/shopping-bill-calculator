apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
  labels:
    app: shopping-bill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-bill
  template:
    metadata:
      labels:
        app: shopping-bill
    spec:
      containers:
      - name: bill-calculator-container
        image: DOCKERHUB_IMAGE_PLACEHOLDER
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-bill-service
spec:
  type: NodePort
  selector:
    app: shopping-bill
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
